<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>系统停止运行</title>
<style>
  :root { color-scheme: light; font-family: ui-rounded, "Microsoft YaHei", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; color: #243044; background: radial-gradient(circle at 10% 5%, #ffe7b8 0, transparent 28rem), radial-gradient(circle at 90% 10%, #dbe9ff 0, transparent 26rem), #f8f6f1; }
  main { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 52px 0 72px; }
  .card { background: rgba(255,255,255,.9); border: 1px solid rgba(36,48,68,.1); border-radius: 24px; box-shadow: 0 18px 48px rgba(39,61,99,.12); padding: 26px; backdrop-filter: blur(10px); }
  .gate { max-width: 480px; margin: 12vh auto; text-align: center; }
  h1 { margin: 0 0 8px; font-size: clamp(28px, 6vw, 42px); letter-spacing: -.02em; }
  h2 { margin: 0; font-size: 20px; }
  p { color: #647087; line-height: 1.65; }
  label { display: block; text-align: left; margin: 22px 0 8px; font-size: 14px; color: #58657a; font-weight: 700; }
  input { width: 100%; border: 1px solid #d8ddea; background: #fff; border-radius: 14px; padding: 14px 15px; color: #243044; font: inherit; outline: none; }
  input:focus { border-color: #6b8ef6; box-shadow: 0 0 0 4px #dfe8ff; }
  button { border: 0; border-radius: 14px; padding: 13px 18px; margin-top: 12px; background: #4267db; color: white; font: inherit; font-weight: 800; cursor: pointer; }
  button:hover { background: #3459ca; }
  button:disabled { opacity: .6; cursor: wait; }
  .error { margin: 16px 0 0; padding: 10px 12px; border-radius: 12px; background: #fff0f0; color: #b42335; font-size: 14px; }
  .identity { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .avatar { display: grid; place-items: center; width: 52px; height: 52px; flex: 0 0 auto; border-radius: 18px; font-size: 28px; background: #edf2ff; }
  .identity small { display: block; margin-top: 3px; color: #7b8799; }
  .notice { margin: 20px 0 22px; padding: 18px; border-radius: 18px; background: #fff7d6; border: 1px solid #f1d77a; color: #5f4a00; font-weight: 800; }
  .message { padding: 17px 0; border-top: 1px solid #ebedf3; }
  .message-head { display: flex; align-items: center; gap: 9px; }
  .message-head .avatar { width: 32px; height: 32px; border-radius: 11px; font-size: 18px; }
  .message time { margin-left: auto; color: #929bad; font-size: 12px; }
  .message p { margin: 10px 0 0 41px; white-space: pre-wrap; word-break: break-word; color: #303b50; }
  .empty { padding: 30px 0 8px; text-align: center; color: #8993a5; }
  .hint { font-size: 13px; }
  .busy { text-align: center; color: #8993a5; padding: 20px 0; }
</style>
</head>
<body>
<div id="app"><main><section class="card"><div class="busy">连接中…</div></section></main></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

const SUPABASE_URL = "https://bhmlgrhskpxgmmujvkac.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_kL6hYQS5Hx2RniZIkTRFxw_C_KcYBsh";

const PERSONAS = [
  ["月亮邮差", "🌙"], ["云朵同学", "☁️"], ["橘子汽水", "🍊"], ["小熊电台", "🐻"], ["星星旅人", "⭐"],
  ["海盐信使", "🐚"], ["晚风收集员", "🍃"], ["草莓日记", "🍓"], ["萤火小队", "✨"], ["山茶花语", "🌺"],
  ["柠檬苏打", "🍋"], ["小雨滴答", "💧"], ["兔子邮差", "🐰"], ["樱花树下", "🌸"], ["薄荷微风", "🌿"],
  ["银河漫游", "🚀"], ["向日葵田", "🌻"], ["抹茶布丁", "🍵"], ["赶海少年", "🦀"], ["猫咪咖啡馆", "🐱"],
  ["星空观测员", "🔭"], ["蒲公英旅人", "🪁"], ["蜜桃乌龙", "🍑"], ["流星许愿", "🌠"], ["北极光屋", "🌌"],
  ["枫糖松饼", "🥞"], ["彩虹糖铺", "🍬"], ["雪人派对", "⛄"], ["奶油甜筒", "🍨"], ["月光走廊", "🌕"],
  ["竹笛清风", "🎋"], ["蓝鲸邮差", "🐋"], ["风铃叮当", "🎐"], ["蜂蜜柠檬", "🍯"], ["山谷回声", "⛰️"],
  ["麦田守望", "🌾"], ["银狐小径", "🦊"], ["红豆汤圆", "🍡"], ["白鹭停云", "🦢"], ["蓝莓派", "🫐"],
  ["灯塔守夜", "🗼"], ["落叶信笺", "🍂"], ["海浪面包", "🥖"], ["铃兰花语", "🔔"], ["蜂鸟送信", "🐦"],
  ["葡萄汽水", "🍇"], ["蜂蜜松糕", "🐝"], ["夜灯蘑菇", "🍄"], ["青柠苏打", "🥤"], ["森林指南针", "🧭"],
];
const ADMIN_MESSAGE = "本系统永久停止运行";

const app = document.getElementById("app");
let currentPersona = null;
let sb = null;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function formatTime(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ` +
         `${p(d.getHours())}:${p(d.getMinutes())}`;
}

async function sha256Hex(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

async function fetchPublicIP() {
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 3000);
    const res = await fetch("https://myip.ipip.net", { signal: ctrl.signal });
    clearTimeout(timer);
    if (!res.ok) return "unknown";
    const text = await res.text();
    const m = text.match(/当前 IP[:：]\s*(\S+)/);
    return m ? m[1] : "unknown";
  } catch (err) {
    return "unknown";
  }
}

async function logAccess(path) {
  try {
    const ip = await fetchPublicIP();
    await sb.from("accesses").insert([{ ip: ip, path: path }]);
  } catch (err) {}
}

async function getPasscodeHash() {
  const { data, error } = await sb
    .from("config").select("value").eq("key", "passcode_hash").maybeSingle();
  if (error || !data) return null;
  return data.value;
}

async function checkPasscode(input) {
  const hash = await getPasscodeHash();
  if (!hash) return false;
  return (await sha256Hex(input)) === hash;
}

async function loadMessages() {
  const el = document.getElementById("messages");
  const { data, error } = await sb
    .from("messages").select("persona_id, content, created_at")
    .order("id", { ascending: false }).limit(100);
  if (error) {
    el.innerHTML = '<div class="empty">加载公告失败，请稍后重试。</div>';
    return;
  }

  const rows = (data || []).slice().reverse();
  const html = rows.map(m => {
    const isAdmin = m.content === ADMIN_MESSAGE;
    const name = isAdmin ? "管理员" : (PERSONAS[m.persona_id] || PERSONAS[0])[0];
    const avatar = isAdmin ? "⚠️" : (PERSONAS[m.persona_id] || PERSONAS[0])[1];
    return `<article class="message"><div class="message-head">
      <span class="avatar">${avatar}</span><strong>${escapeHtml(name)}</strong>
      <time>${escapeHtml(formatTime(m.created_at))}</time>
    </div><p>${escapeHtml(m.content)}</p></article>`;
  }).join("") || renderAdminMessageOnly();
  el.innerHTML = html;
}

function renderAdminMessageOnly() {
  return `<article class="message"><div class="message-head">
    <span class="avatar">⚠️</span><strong>管理员</strong>
  </div><p>${ADMIN_MESSAGE}</p></article>`;
}

function renderGate() {
  app.innerHTML = `
    <main class="gate"><section class="card">
      <div class="avatar" style="margin:0 auto 16px">⚠️</div>
      <h1>系统停止运行</h1>
      <p>输入访问口令后，可查看最终公告。留言功能已经关闭。</p>
      <form id="gate-form">
        <label for="passcode">访问口令</label>
        <input id="passcode" type="password" inputmode="numeric" required autofocus>
        <button type="submit">查看公告</button>
      </form>
      <div id="gate-error" class="error" hidden></div>
    </section></main>`;
  document.getElementById("gate-form").addEventListener("submit", onGateSubmit);
}

async function renderBoard() {
  app.innerHTML = `
    <main><section class="card">
      <header class="identity"><span class="avatar">⚠️</span><div>
        <h2>管理员公告</h2><small>留言功能已关闭</small>
      </div></header>
      <div class="notice">本系统永久停止运行</div>
      <p class="hint">页面仅保留最终公告，不再接受新的留言。</p>
      <div id="messages"><div class="busy">加载公告中…</div></div>
    </section></main>`;
  await loadMessages();
}

async function onGateSubmit(e) {
  e.preventDefault();
  const btn = e.target.querySelector("button");
  btn.disabled = true;
  const errEl = document.getElementById("gate-error");
  errEl.hidden = true;
  const ok = await checkPasscode(document.getElementById("passcode").value);
  if (!ok) {
    errEl.textContent = "访问口令不正确，请重试。";
    errEl.hidden = false;
    btn.disabled = false;
    return;
  }
  localStorage.setItem("guestbook_persona", "0");
  currentPersona = 0;
  await renderBoard();
}

async function boot() {
  if (SUPABASE_URL.includes("YOUR-PROJECT") || SUPABASE_ANON_KEY.includes("YOUR-")) {
    app.innerHTML = `<main class="gate"><section class="card">
      <h1>系统停止运行</h1>
      <p>还没有配置 Supabase。</p>
    </section></main>`;
    return;
  }
  if (typeof supabase === "undefined") {
    app.innerHTML = `<main class="gate"><section class="card">
      <h1>系统停止运行</h1><p>加载 Supabase 客户端失败，可能是 CDN 被网络屏蔽，请稍后重试。</p>
    </section></main>`;
    return;
  }
  window.supabase = sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  logAccess(location.pathname || "/");

  const stored = localStorage.getItem("guestbook_persona");
  if (stored != null) {
    currentPersona = 0;
    await renderBoard();
  } else {
    renderGate();
  }
}

window.addEventListener("DOMContentLoaded", boot);
</script>
</body>
</html>
