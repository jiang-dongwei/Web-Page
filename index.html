<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>留言板入口</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f6fb; color: #1d2939; }
    main { width: min(420px, calc(100% - 40px)); padding: 30px; box-sizing: border-box; background: white; border: 1px solid #e3e8f1; border-radius: 18px; box-shadow: 0 12px 32px #1d293914; text-align: center; }
    h1 { margin: 0 0 12px; font-size: 24px; }
    p { color: #667085; line-height: 1.65; }
    a { display: none; margin-top: 20px; padding: 12px 16px; border-radius: 10px; background: #2766d8; color: white; text-decoration: none; font-weight: 700; }
    .error { color: #b42318; }
  </style>
</head>
<body>
  <main>
    <h1>留言板入口</h1>
    <p id="status">正在获取当前访问地址…</p>
    <a id="go" rel="noopener">进入留言板</a>
  </main>
  <script>
    const status = document.querySelector("#status");
    const go = document.querySelector("#go");
    fetch("./tunnel.json?ts=" + Date.now(), { cache: "no-store" })
      .then((response) => response.ok ? response.json() : Promise.reject())
      .then(({ url, updated_at }) => {
        if (!/^https:\/\/.+/.test(url)) throw new Error("invalid url");
        go.href = url;
        go.style.display = "inline-block";
        status.textContent = updated_at
          ? "当前地址已更新：" + new Date(updated_at).toLocaleString()
          : "当前地址可用。";
      })
      .catch(() => {
        status.className = "error";
        status.textContent = "当前没有可用的访问地址，请稍后刷新。";
      });
  </script>
</body>
</html>
